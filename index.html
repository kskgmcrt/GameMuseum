<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME MUSEUM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DotGothic16&display=swap">
<style>
/* Layout: a bright exhibition hall. Grid floor, exhibits as framed panels with museum plaques (No. / room / status). */
:root{
  --floor:#eef3fb; --panel:#ffffff; --ink:#151a3c; --ink-soft:#586089; --line:#d3dbee;
  --coral:#ff4f64; --cyan:#00b8cf; --sun:#ffc929; --mint:#19c98a; --violet:#6c5ce7;
  --display:"Unbounded","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --pixel:"DotGothic16","Zen Kaku Gothic New",monospace;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--floor);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;background-attachment:fixed;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--panel)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.logo{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:14px;height:14px;background:var(--sun);display:inline-block;transform:rotate(45deg)}
.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.top nav a{font-family:var(--pixel);font-size:14px;text-decoration:none;padding:4px 12px;border-radius:99px;letter-spacing:.08em}
.top nav a:hover{background:var(--panel);color:var(--ink)}

/* hero */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:center}
.eyebrow{font-family:var(--pixel);letter-spacing:.14em;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow b{background:var(--ink);color:var(--sun);padding:2px 10px;border-radius:6px;font-weight:400}
h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,8.2vw,104px);line-height:.95;margin:14px 0 0;letter-spacing:-.02em}
h1 span{display:block}
h1 .l2{color:var(--panel);-webkit-text-stroke:2.5px var(--ink);text-shadow:6px 6px 0 var(--coral)}
.sub{font-family:var(--display);font-weight:500;font-size:clamp(15px,2vw,22px);margin:22px 0 0;display:flex;align-items:center;gap:12px}
.sub::before{content:"";width:44px;height:4px;background:var(--cyan)}
.lead{max-width:34em;color:var(--ink-soft);margin:16px 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:900;text-decoration:none;border:2.5px solid var(--ink);border-radius:99px;padding:10px 22px;background:var(--panel);box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.play{background:var(--sun)}
.btn.big{font-family:var(--display);font-size:20px;padding:18px 40px;background:var(--coral);color:var(--panel)}
.tri{width:0;height:0;border-left:10px solid currentColor;border-block:6px solid transparent}

.feat{display:grid;gap:16px;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr}
.feat .fc:first-child{grid-row:span 2}
.fc{position:relative;border:2.5px solid var(--ink);border-radius:var(--r);overflow:hidden;background:var(--ink);box-shadow:6px 6px 0 var(--ink);display:flex;min-height:150px}
.fc .art{position:absolute;inset:0}
.fc .info{position:relative;margin-top:auto;width:100%;padding:36px 14px 12px;color:var(--panel);background:linear-gradient(transparent,var(--ink) 75%)}
.fc h3{font-family:var(--display);font-size:clamp(14px,1.7vw,20px);margin:0 0 8px;line-height:1.2}
.fc .mini{display:flex;gap:8px;flex-wrap:wrap}
.fc .mini a{font-size:13px;font-weight:700;text-decoration:none;padding:3px 12px;border-radius:99px;background:var(--panel);color:var(--ink)}
.fc .mini a.p{background:var(--sun)}
.fc .mini a:hover{background:var(--cyan)}
.art canvas,.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.fc:hover .art>*,.card:hover .art>*{transform:scale(1.08) rotate(-1.2deg)}

/* section heads */
section{padding-block:36px}
.sh{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,42px);margin:0;line-height:1.1}
.sh p{margin:0;color:var(--ink-soft);font-size:14px}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.room{text-align:left;border:2.5px solid var(--ink);border-radius:14px;background:var(--panel);padding:10px 12px;position:relative;transition:transform .15s}
.room:hover{transform:translateY(-3px)}
.room .n{font-family:var(--pixel);font-size:12px;color:var(--ink-soft);letter-spacing:.1em}
.room .t{font-family:var(--display);font-size:12.5px;font-weight:800;display:block;margin:2px 0}
.room .j{font-size:13px;color:var(--ink-soft)}
.room .c{position:absolute;top:8px;right:10px;font-family:var(--pixel);font-size:13px;background:var(--rc,var(--ink));color:var(--ink);border-radius:99px;padding:0 9px;line-height:1.6}
.room[aria-pressed="true"]{background:var(--ink);color:var(--panel);box-shadow:4px 4px 0 var(--rc,var(--coral))}
.room[aria-pressed="true"] .n,.room[aria-pressed="true"] .j{color:var(--line)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:var(--panel);border-radius:99px;padding:3px 14px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
#q{margin-left:auto;flex:1 1 200px;max-width:300px;min-width:0;font:inherit;border:2px solid var(--ink);border-radius:99px;padding:5px 16px;background:var(--panel);color:var(--ink)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.card{border:2.5px solid var(--ink);border-radius:var(--r);background:var(--panel);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;box-shadow:5px 5px 0 var(--ink);min-width:0}
.card:hover{transform:translateY(-6px) scale(1.015);box-shadow:9px 11px 0 var(--ink)}
.card .art{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--ink);display:block;border-bottom:2.5px solid var(--ink)}
.card .ov{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;background:color-mix(in srgb,var(--ink) 45%,transparent)}
.card:hover .ov,.card:focus-within .ov{opacity:1}
.ov span{transform:none!important;font-family:var(--display);font-weight:800;font-size:14px;background:var(--sun);color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:8px 20px;display:flex;gap:8px;align-items:center}
.ribbon{position:absolute;top:12px;left:-34px;transform:rotate(-35deg)!important;background:var(--sun);color:var(--ink);font-family:var(--pixel);font-size:12px;padding:2px 40px;border-block:2px solid var(--ink);letter-spacing:.1em;width:auto!important;height:auto!important}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.plq{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--pixel);font-size:13px;color:var(--ink-soft);letter-spacing:.08em}
.st{font-family:var(--pixel);font-size:12px;letter-spacing:.08em;border-radius:6px;padding:1px 9px;background:var(--sc);color:var(--ink);border:1.5px solid var(--ink);white-space:nowrap}
.card h3{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.25;margin:0}
.card h3 a{text-decoration:none}
.card h3 a:hover{color:var(--coral)}
.genre{font-size:13px;font-weight:700;color:var(--ink-soft)}
.card p{margin:0;font-size:14.5px;line-height:1.65}
.card .act{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.card .btn{font-size:14px;padding:6px 16px;box-shadow:3px 3px 0 var(--ink)}
.soon{font-family:var(--pixel);font-size:13px;color:var(--ink-soft);align-self:center}
.empty{border:2.5px dashed var(--ink-soft);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--ink-soft);grid-column:1/-1;font-family:var(--pixel)}

/* about */
.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;list-style:none;padding:0;margin:0;counter-reset:s}
.cycle li{background:var(--panel);border:2.5px solid var(--ink);border-radius:14px;padding:14px;font-weight:700;counter-increment:s}
.cycle li::before{content:"STEP " counter(s);display:block;font-family:var(--pixel);font-size:12px;color:var(--coral);letter-spacing:.1em}
footer{padding-block:30px 44px;font-family:var(--pixel);font-size:13px;color:var(--ink-soft);text-align:center}

/* detail */
.back{display:inline-flex;margin:22px 0 14px;font-weight:700;font-size:14px;text-decoration:none;border-bottom:2px solid var(--ink)}
.dhero{position:relative;border:2.5px solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:8px 8px 0 var(--ink);background:var(--ink)}
.dhero .art{aspect-ratio:21/9;min-height:220px;width:100%}
.dhero .cap{position:absolute;inset:auto 0 0 0;padding:60px 24px 20px;color:var(--panel);background:linear-gradient(transparent,var(--ink) 80%)}
.dhero h1{font-size:clamp(30px,6vw,68px);margin:8px 0 4px;line-height:1.05}
.dhero .plq{color:var(--line);justify-content:flex-start;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:26px;margin-top:28px;align-items:start}
.blk{background:var(--panel);border:2.5px solid var(--ink);border-radius:var(--r);padding:20px 22px;margin-bottom:20px;min-width:0}
.blk h2{font-size:15px;letter-spacing:.08em;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.blk h2::before{content:"";width:12px;height:12px;background:var(--k,var(--coral));transform:rotate(45deg);flex:none}
.blk p{margin:0 0 .6em}.blk ol,.blk ul{margin:0;padding-left:1.3em}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.shots figure{margin:0}
.shots .art{aspect-ratio:16/9;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--ink)}
.shots figcaption{font-family:var(--pixel);font-size:12px;color:var(--ink-soft);margin-top:4px}
.tech{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0!important}
.tech li{font-family:var(--pixel);font-size:14px;border:2px solid var(--ink);border-radius:8px;padding:1px 12px;background:var(--floor)}
.track{list-style:none;padding:0!important;display:grid;gap:6px}
.track li{display:flex;align-items:center;gap:10px;font-family:var(--pixel);font-size:14px;color:var(--ink-soft)}
.track li::before{content:"";width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;background:var(--panel);flex:none}
.track li.done{color:var(--ink)}.track li.done::before{background:var(--ink)}
.track li.now{color:var(--ink);font-weight:700}.track li.now::before{background:var(--sc);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 35%,transparent)}
.log{list-style:none;padding:0!important;border-left:3px solid var(--ink);margin-left:6px!important}
.log li{position:relative;padding:0 0 12px 18px}
.log li::before{content:"";position:absolute;left:-8.5px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--cyan);border:2px solid var(--ink)}
.log time{font-family:var(--pixel);font-size:14px;display:block;color:var(--ink-soft)}
.playbox{text-align:center;padding:28px 20px;background:var(--ink);color:var(--panel)}
.playbox p{font-family:var(--pixel);margin:0 0 16px;letter-spacing:.1em}
.playbox .btn{box-shadow:5px 5px 0 var(--sun);border-color:var(--panel)}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:10px 30px}

@media (max-width:860px){
  .hero .wrap,.dgrid{grid-template-columns:minmax(0,1fr)}
  .hero{padding-block:32px 20px}
  #q{margin-left:0;max-width:none}
  .dhero .art{aspect-ratio:16/10}
}
@media (max-width:480px){
  .feat{grid-template-columns:1fr;grid-template-rows:auto}
  .feat .fc:first-child{grid-row:auto}
  .fc{min-height:170px}
  .top nav a{padding:2px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#home"><i></i>GAME MUSEUM</a>
  <nav><a href="#home">TOP</a><a href="#exhibition">EXHIBITION</a><a href="#about">ABOUT</a></nav>
</div></header>
<main id="app"></main>
<footer class="wrap">GAME MUSEUM / My Game Collection — 作る、展示する、また作る。</footer>

    howToPlay:["PCは WASD + マウス、スマートフォンはタッチで操作","4色のメガネを切り替えて、見える世界とルールを変える","色ごとのルールを使い分けて、自分で道をつくりながら進む"],
    technology:["HTML","CSS","JavaScript","Three.js","WebGL"],
    gameUrl:"https://kskgmcrt.github.io/VisionShift/",
    thumbnail:VISION_THUMB, screenshots:[], art:"vision", colors:["#00b8cf","#6c5ce7","#151a3c"],
    log:[{date:"2026",text:"ブラウザ版を公開"}],
    notes:"",
  },
  {
    id:"bacteria-battle", title:"細菌バトル", featured:true,
    rooms:["ACTION","EDUCATION"], genre:"3D / アクション / 戦略", status:"DEVELOPING",
    description:"仲間の細菌を増やしながら敵勢力と戦う3Dゲーム。",
    concept:"増えろ、群れろ、食い尽くせ。1匹から始めて、2、4、8、16…と分裂で増えていく。",
    howToPlay:["WASDで移動","Rで分裂して仲間を増やし、Eで集合させる","SPACEでスキル発動、Fでスキル切替、Qで切替","ESCで一時停止"],
    technology:["HTML","CSS","JavaScript","Three.js","WebGL"],
    gameUrl:"https://kskgmcrt.github.io/BacteriaBattle/",
    thumbnail:BACTERIA_THUMB, screenshots:[], art:"bacteria", colors:["#19c98a","#ffc929","#151a3c"],
    log:[
      {date:"2026.09",text:"ゲームコンセプト作成"},
      {date:"2026.10",text:"3Dプロトタイプ制作"},
    ],
    notes:"開発中のバージョンを公開しています。内容は今後変わります。",
  },
];
/* ===================== ここから下は展示の仕組み ===================== */

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stage = id => STAGES.find(s=>s.id===id) || STAGES[0];
const no = g => "No." + String(GAMES.indexOf(g)+1).padStart(3,"0");
const state = { room:"ALL", status:"ALL", q:"" };

/* ---- コンセプトポスター（画像が未登録のときに描く絵） ---- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=7;for(const c of s)h=Math.imul(h,31)+c.charCodeAt(0)|0;return h}
function poster(cv){
  const g = GAMES.find(x=>x.id===cv.dataset.g); if(!g) return;
  const v = +cv.dataset.v||0, W=cv.width=640, H=cv.height=360, c=cv.getContext("2d");
  const [A,B,K]=g.colors||["#00b8cf","#ffc929","#151a3c"], r=rng(hash(g.id)+v*977);
  c.fillStyle=A;c.fillRect(0,0,W,H);
  // 床のパース線
  c.strokeStyle="rgba(255,255,255,.28)";c.lineWidth=2;
  for(let i=-8;i<=8;i++){c.beginPath();c.moveTo(W/2+i*18,H*.5);c.lineTo(W/2+i*130,H);c.stroke()}
  for(let i=0;i<6;i++){const y=H*.5+Math.pow(i/6,1.8)*H*.5;c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  c.fillStyle=B;c.beginPath();c.arc(W*(.2+r()*.6),H*.3,70+r()*50,0,7);c.fill();
  const cx=W*(.42+r()*.16), cy=H*.56, s=1+v*.12;
  c.save();c.translate(cx,cy);c.scale(s,s);c.lineWidth=7;c.strokeStyle=K;c.lineJoin=c.lineCap="round";
  const blob=(x,y,rx,ry,f)=>{c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fillStyle=f;c.fill();c.stroke()};
  if(g.art==="crab"){
    for(let i=0;i<3;i++)for(const d of[-1,1]){c.beginPath();c.moveTo(d*70,10+i*14);c.lineTo(d*(120+i*8),40+i*22);c.stroke()}
    for(const d of[-1,1]){c.beginPath();c.moveTo(d*70,-20);c.lineTo(d*125,-70);c.stroke();
      c.beginPath();c.arc(d*140,-92,34,d>0?-.4:Math.PI-.9,d>0?Math.PI+.9:Math.PI*2+.4);c.lineTo(d*140,-92);c.closePath();c.fillStyle="#fff";c.fill();c.stroke()}
    blob(0,0,95,60,"#fff");
    for(const d of[-1,1]){c.beginPath();c.moveTo(d*26,-52);c.lineTo(d*30,-86);c.stroke();blob(d*30,-92,11,11,K)}
    c.beginPath();c.arc(0,8,26,.2,Math.PI-.2);c.stroke();
    for(let i=0;i<10;i++){const a=r()*7,d=190+r()*40;c.beginPath();c.moveTo(Math.cos(a)*d,Math.sin(a)*d*.6);c.lineTo(Math.cos(a)*(d+40),Math.sin(a)*(d+40)*.6);c.stroke()}
  }else if(g.art==="vision"){
    c.restore();c.save();c.fillStyle=B;c.fillRect(W/2,0,W/2,H);
    c.strokeStyle="rgba(255,255,255,.3)";c.lineWidth=2;for(let i=0;i<9;i++){c.strokeRect(W/2+20+i*34,H-40-r()*150,26,200)}
    c.translate(W/2,H*.5);c.scale(s,s);c.lineWidth=8;c.strokeStyle=K;c.lineJoin=c.lineCap="round";
    for(const d of[-1,1]){c.beginPath();c.roundRect(d>0?14:-134,-48,120,92,26);c.fillStyle=d>0?A:B;c.fill();c.stroke();
      c.beginPath();c.moveTo(d*134,-20);c.lineTo(d*190,-44);c.stroke();
      c.fillStyle="rgba(255,255,255,.75)";c.beginPath();c.moveTo(d*74-30,-30);c.lineTo(d*74-6,-30);c.lineTo(d*74-36,22);c.lineTo(d*74-50,22);c.closePath();c.fill()}
    c.beginPath();c.moveTo(-14,-10);c.quadraticCurveTo(0,-26,14,-10);c.stroke();
  }else if(g.art==="bacteria"){
    c.restore();c.save();c.lineWidth=5;c.strokeStyle=K;c.lineCap="round";
    for(let i=0;i<22;i++){
      const x=r()*W,y=r()*H,R=14+r()*38,enemy=r()<.35,rot=r()*3;
      c.save();c.translate(x,y);c.rotate(rot);
      for(let k=0;k<10;k++){const a=k/10*6.283;c.beginPath();c.moveTo(Math.cos(a)*R*1.4,Math.sin(a)*R*.8);c.lineTo(Math.cos(a)*(R*1.4+9),Math.sin(a)*(R*.8+9));c.stroke()}
      c.beginPath();c.ellipse(0,0,R*1.4,R*.8,0,0,7);c.fillStyle=enemy?B:"#fff";c.fill();c.stroke();
      c.fillStyle=K;c.beginPath();c.arc(-R*.4,-2,R*.12,0,7);c.arc(R*.4,-2,R*.12,0,7);c.fill();
      c.restore();
    }
  }else if(g.art==="baby"){
    c.beginPath();c.moveTo(-90,-10);c.lineTo(90,-10);c.arc(0,-10,90,0,Math.PI);c.closePath();c.fillStyle="#fff";c.fill();c.stroke();
    c.beginPath();c.moveTo(0,-10);c.arc(0,-10,90,Math.PI,Math.PI*1.5);c.closePath();c.fillStyle=B;c.fill();c.stroke();
    c.beginPath();c.moveTo(90,-10);c.lineTo(150,-90);c.stroke();
    blob(-50,104,24,24,K);blob(50,104,24,24,K);
    blob(40,-36,26,26,"#fff");c.fillStyle=K;c.beginPath();c.arc(32,-40,3.5,0,7);c.arc(48,-40,3.5,0,7);c.fill();
    c.beginPath();c.moveTo(66,-50);c.lineTo(120,-120);c.stroke();c.beginPath();c.moveTo(120,-120);c.lineTo(100,-112);c.moveTo(120,-120);c.lineTo(118,-98);c.stroke();
  }else{
    for(let i=0;i<7;i++){c.save();c.rotate(r()*6);c.fillStyle=i%2?"#fff":B;const w=40+r()*120;c.beginPath();c.roundRect(-w/2+r()*200-100,-w/2+r()*120-60,w,w,12);c.fill();c.stroke();c.restore()}
  }
  c.restore();
}
function art(g,v=0){
  const src = v===0 ? g.thumbnail : (g.screenshots||[])[v-1];
  return src ? `<img src="${esc(src)}" alt="${esc(g.title)}の画面" loading="lazy">`
             : `<canvas data-g="${esc(g.id)}" data-v="${v}" role="img" aria-label="${esc(g.title)}のコンセプトイメージ"></canvas>`;
}
const badge = g => {const s=stage(g.status);return `<span class="st" style="--sc:var(${s.color})">${s.id}</span>`};
const playable = g => !!g.gameUrl;
const ribbon = g => g.status==="RELEASED" ? "" : `<span class="ribbon">${g.status==="IDEA"?"COMING SOON":"IN DEVELOPMENT"}</span>`;

/* ---- カード ---- */
function card(g){
  return `<article class="card">
    <a class="art" href="#g-${esc(g.id)}" aria-label="${esc(g.title)}の展示ページへ">${art(g)}${ribbon(g)}
      <span class="ov"><span>${playable(g)?'<i class="tri"></i>VIEW &amp; PLAY':'VIEW'}</span></span></a>
    <div class="body">
      <div class="plq"><span>${no(g)} / ${g.rooms.map(esc).join(" · ")}</span>${badge(g)}</div>
      <h3><a href="#g-${esc(g.id)}">${esc(g.title)}</a></h3>
      <div class="genre">${esc(g.genre)}</div>
      <p>${esc(g.description)}</p>
      <div class="act">
        ${playable(g)?`<a class="btn play" href="${esc(g.gameUrl)}" target="_blank" rel="noopener"><i class="tri"></i>PLAY</a>`:`<span class="soon">COMING SOON</span>`}
        <a class="btn" href="#g-${esc(g.id)}">作品を見る</a>
      </div>
    </div></article>`;
}

function filtered(){
  const q=state.q.trim().toLowerCase();
  return GAMES.filter(g =>
    (state.room==="ALL"||g.rooms.includes(state.room)) &&
    (state.status==="ALL"||stage(g.status).group===state.status) &&
    (!q||[g.title,g.genre,g.description,...(g.technology||[])].join(" ").toLowerCase().includes(q)));
}
function drawGrid(){
  const list=filtered();
  $("#grid").innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty">この条件の展示はまだありません。<br>NEXT EXHIBIT — 準備中</div>`;
  $("#count").textContent = `${list.length} / ${GAMES.length} 作品を表示中`;
  document.querySelectorAll("[data-room]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.room===state.room));
  document.querySelectorAll("[data-status]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.status===state.status));
  paint();
}
const paint = () => document.querySelectorAll("canvas[data-g]").forEach(poster);

/* ---- トップ ---- */
function home(){
  const feat = GAMES.filter(g=>g.featured).slice(0,3);
  const cnt = id => GAMES.filter(g=>g.rooms.includes(id)).length;
  $("#app").innerHTML = `
  <section class="hero"><div class="wrap">
    <div>
      <div class="eyebrow"><b>OPEN</b> NOW EXHIBITING ${GAMES.length} WORKS / ${ROOMS.filter(r=>cnt(r.id)).length} ROOMS</div>
      <h1><span>GAME</span><span class="l2">MUSEUM</span></h1>
      <p class="sub">My Game Collection</p>
      <p class="lead">自分で作ったゲームを、一つずつ展示作品としてコレクションしていくゲーム博物館。完成した作品も、まだ開発中の作品も、そのまま展示しています。</p>
      <div class="btns"><a class="btn play" href="#exhibition">展示を見てまわる</a><a class="btn" href="#about">この博物館について</a></div>
    </div>
    <div class="feat">${feat.map(g=>`
      <div class="fc"><div class="art">${art(g)}</div>
        <div class="info"><div class="plq" style="color:var(--line);justify-content:flex-start">${no(g)} ${badge(g)}</div>
          <h3>${esc(g.title)}</h3>
          <div class="mini"><a href="#g-${esc(g.id)}">作品を見る</a>${playable(g)?`<a class="p" href="${esc(g.gameUrl)}" target="_blank" rel="noopener">ゲームを遊ぶ</a>`:""}</div>
        </div></div>`).join("")}
    </div>
  </div></section>

  <section id="exhibition"><div class="wrap">
    <div class="sh"><h2>EXHIBITION</h2><p>FLOOR MAP — 展示室を選んで作品を探す</p></div>
    <div class="rooms">
      <button class="room" data-room="ALL" style="--rc:var(--sun)"><span class="n">ALL FLOORS</span><span class="t">ALL ROOMS</span><span class="j">すべて</span><span class="c">${GAMES.length}</span></button>
      ${ROOMS.map((r,i)=>`<button class="room" data-room="${r.id}" style="--rc:var(${r.color})"><span class="n">ROOM ${String(i+1).padStart(2,"0")}</span><span class="t">${esc(r.name)}</span><span class="j">${esc(r.label)}</span><span class="c">${cnt(r.id)}</span></button>`).join("")}
    </div>
    <div class="tools">
      <div class="chips" role="group" aria-label="開発ステータスで絞り込む">
        <button class="chip" data-status="ALL">すべて</button>
        <button class="chip" data-status="released">公開済み</button>
        <button class="chip" data-status="dev">開発中</button>
        <button class="chip" data-status="idea">アイデア</button>
      </div>
      <span id="count" class="soon"></span>
      <input id="q" type="search" placeholder="作品名・技術でさがす" aria-label="作品を検索" value="${esc(state.q)}">
    </div>
    <div class="grid" id="grid"></div>
  </div></section>

  <section id="about"><div class="wrap">
    <div class="sh"><h2>ABOUT</h2><p>作品が増えるほど、博物館も大きくなる</p></div>
    <ol class="cycle"><li>ゲームを作る</li><li>博物館に展示する</li><li>また新しいゲームを作る</li><li>展示作品が増える</li></ol>
  </div></section>`;
  $("#app").onclick = e => {
    const b=e.target.closest("[data-room],[data-status]"); if(!b) return;
    if(b.dataset.room) state.room=b.dataset.room; else state.status=b.dataset.status;
    drawGrid();
  };
  $("#q").oninput = e => { state.q=e.target.value; drawGrid(); };
  drawGrid();
}

/* ---- 展示ページ ---- */
function detail(g){
  const i=GAMES.indexOf(g), s=stage(g.status), si=STAGES.indexOf(s);
  const prev=GAMES[i-1], next=GAMES[i+1];
  const shots = (g.screenshots&&g.screenshots.length) ? g.screenshots.map((_,k)=>k+1) : [1,2,3];
  const real = g.screenshots&&g.screenshots.length;
  const rooms = g.rooms.map(id=>(ROOMS.find(r=>r.id===id)||{name:id}).name).join(" / ");
  $("#app").onclick=null;
  $("#app").innerHTML = `<div class="wrap">
    <a class="back" href="#exhibition">← EXHIBITION にもどる</a>
    <div class="dhero"><div class="art">${art(g)}</div>
      <div class="cap"><div class="plq"><span>${no(g)}</span><span>${esc(rooms)}</span>${badge(g)}</div>
        <h1>${esc(g.title)}</h1><div>${esc(g.genre)}</div></div></div>
    <div class="dgrid">
      <div>
        <div class="blk"><h2>CONCEPT</h2><p><strong>${esc(g.concept||"")}</strong></p><p>${esc(g.description)}</p></div>
        <div class="blk" style="--k:var(--cyan)"><h2>HOW TO PLAY</h2>${g.howToPlay&&g.howToPlay.length?`<ol>${g.howToPlay.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:`<p>遊び方は制作中です。</p>`}</div>
        <div class="blk" style="--k:var(--sun)"><h2>SCREENSHOTS</h2><div class="shots">${shots.map(k=>`<figure><div class="art">${art(g,k)}</div><figcaption>${real?"SCREENSHOT":"CONCEPT IMAGE"} ${String(k).padStart(2,"0")}</figcaption></figure>`).join("")}</div></div>
        ${g.notes?`<div class="blk" style="--k:var(--violet)"><h2>制作メモ</h2><p>${esc(g.notes)}</p></div>`:""}
      </div>
      <aside>
        <div class="blk playbox">${playable(g)
          ?`<p>${g.status==="RELEASED"?"READY TO PLAY":"IN DEVELOPMENT — 開発版をプレイできます"}</p><a class="btn big" href="${esc(g.gameUrl)}" target="_blank" rel="noopener"><i class="tri"></i>PLAY GAME</a>`
          :`<p>COMING SOON</p><div>この作品はまだプレイできません。</div>`}</div>
        <div class="blk" style="--k:var(--mint)"><h2>DEVELOPMENT STATUS</h2><ol class="track">${STAGES.map((x,k)=>`<li class="${k<si?"done":k===si?"now":""}" style="--sc:var(${x.color})">${x.id} <span>${esc(x.label)}</span></li>`).join("")}</ol></div>
        <div class="blk" style="--k:var(--violet)"><h2>TECHNOLOGY</h2><ul class="tech">${(g.technology||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
        <div class="blk" style="--k:var(--cyan)"><h2>DEVELOPMENT LOG</h2>${g.log&&g.log.length?`<ol class="log">${g.log.map(l=>`<li><time>${esc(l.date)}</time>${esc(l.text)}</li>`).join("")}</ol>`:`<p>記録はまだありません。</p>`}</div>
      </aside>
    </div>
    <div class="pn">${prev?`<a class="btn" href="#g-${esc(prev.id)}">← ${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="btn" href="#g-${esc(next.id)}">${esc(next.title)} →</a>`:""}</div>
  </div>`;
  paint();
}

/* ---- ルーティング（#g-作品ID で展示ページ） ---- */
function route(){
  const h=location.hash.slice(1);
  const g = h.startsWith("g-") && GAMES.find(x=>x.id===h.slice(2));
  if(g){ detail(g); window.scrollTo(0,0); return; }
  if(!$("#grid")) home();
  if(h==="exhibition"||h==="about") $("#"+h)?.scrollIntoView(); else window.scrollTo(0,0);
}
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
